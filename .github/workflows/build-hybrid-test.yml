name: NyroxOS Hybrid Test

on:
  workflow_dispatch:
  push:
    branches: [test-iso-boot]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h /

      - name: Build Debian Live ISO
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -euxc '
              apt-get update
              apt-get install -y live-build debootstrap \
                squashfs-tools xorriso isolinux syslinux-common \
                grub-pc-bin grub-efi-amd64-bin dosfstools mtools

              rm -rf config/binary config/bootstrap config/chroot \
                config/common config/source

              lb config \
                --mode debian \
                --distribution trixie \
                --backports true \
                --architectures amd64 \
                --binary-images iso-hybrid \
                --archive-areas "main contrib non-free-firmware" \
                --mirror-bootstrap https://deb.debian.org/debian/ \
                --mirror-chroot https://deb.debian.org/debian/ \
                --mirror-binary https://deb.debian.org/debian/ \
                --mirror-chroot-security https://security.debian.org/debian-security/ \
                --mirror-binary-security https://security.debian.org/debian-security/ \
                --debian-installer none \
                --bootappend-live "boot=live components persistence username=user"

              lb build
              test -s binary/live/filesystem.squashfs
              unsquashfs -ll binary/live/filesystem.squashfs | grep -q 'usr/local/bin/nyrox'
              echo 'Nyrox Terminal verified inside filesystem.squashfs'
            '
      - name: Verify ISO output
        run: |
          ls -lh live-image-amd64.hybrid.iso
          test -s live-image-amd64.hybrid.iso

      - name: Split ISO for GitHub Release
        run: |
          split -b 1500M -d -a 2 live-image-amd64.hybrid.iso NyroxOS-part-

      - name: Publish ISO parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nyroxos-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" NyroxOS-part-*             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "NyroxOS Test ${GITHUB_RUN_NUMBER}"             --notes "Experimental NyroxOS ISO split into parts. Join the parts in numeric order before use."
