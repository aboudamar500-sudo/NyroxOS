name: Build NyroxOS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h /

      - name: Build Debian Live ISO
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -euxc '
              apt-get update
              apt-get install -y live-build debootstrap \
                squashfs-tools xorriso isolinux syslinux-common \
                grub-pc-bin grub-efi-amd64-bin dosfstools mtools

              rm -rf config/binary config/bootstrap config/chroot \
                config/common config/source

              lb config \
                --mode debian \
                --distribution trixie \
                --backports true \
                --architectures amd64 \
                --binary-images iso \
                --archive-areas "main contrib non-free-firmware" \
                --mirror-bootstrap https://deb.debian.org/debian/ \
                --mirror-chroot https://deb.debian.org/debian/ \
                --mirror-binary https://deb.debian.org/debian/ \
                --mirror-chroot-security https://security.debian.org/debian-security/ \
                --mirror-binary-security https://security.debian.org/debian-security/ \
                --debian-installer none \
                --bootappend-live "boot=live components persistence username=user"

              lb build
              test -s binary/live/filesystem.squashfs
              unsquashfs -ll binary/live/filesystem.squashfs | grep -q 'usr/local/bin/nyrox'
              echo 'Nyrox Terminal verified inside filesystem.squashfs'
            '
      - name: Verify ISO output
        run: |
          ls -lh live-image-amd64.iso
          test -s live-image-amd64.iso

      - name: Prepare release files
        id: release
        run: |
          set -euo pipefail
          mkdir release-files
          split -b 1900M -d -a 3 live-image-amd64.iso release-files/NyroxOS.iso.part-
          sha256sum release-files/* > release-files/SHA256SUMS
          echo "tag=nyroxos-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish NyroxOS Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.release.outputs.tag }}" release-files/* --repo "$GITHUB_REPOSITORY" --title "NyroxOS Build $GITHUB_RUN_NUMBER" --notes "Automated NyroxOS build. Download all ISO parts and SHA256SUMS, then join the parts in filename order before using the ISO."
