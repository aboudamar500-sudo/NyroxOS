name: Build NyroxOS

on:
  workflow_dispatch:
  push:
    branches: [main, test-iso-boot]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h /

      - name: Download and install Android Studio
        run: |
          set -euo pipefail
          archive=$(mktemp /tmp/android-studio-XXXXXX.tar.gz)
          trap 'rm -f "$archive"' EXIT

          curl -fL --retry 3 \
            "https://github.com/aboudamar500-sudo/NyroxOS/releases/download/android-studio-rabbit2/android-studio-rabbit2-patch1-linux.tar.gz" \
            -o "$archive"

          echo "11ecbf0e6dc0f04a1353f797e45bf239a3ff1a82221539b1b8cdd7eab0d8d8ea  $archive" | sha256sum -c -

          mkdir -p config/includes.chroot/opt
          tar -xzf "$archive" -C config/includes.chroot/opt

          test -f config/includes.chroot/opt/android-studio/bin/studio.sh
          test -f config/includes.chroot/opt/android-studio/bin/studio.png

          echo "Android Studio extracted and verified."

      - name: Build signed update bundle
        env:
          NYROX_UPDATE_SIGNING_KEY: ${{ secrets.NYROX_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          rm -rf release-files
          find packaging -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 tools/build-update.py
          rm -f config/packages.chroot/nyroxos-*.deb
          cp -f release-files/*.deb config/packages.chroot/
          ls -lh config/packages.chroot/

      - name: Build Debian Live ISO
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -euxc '
              apt-get update
              apt-get install -y live-build debootstrap \
                squashfs-tools xorriso isolinux syslinux-common \
                grub-pc-bin grub-efi-amd64-bin dosfstools mtools

              rm -rf config/binary config/bootstrap config/chroot \
                config/common config/source

              lb config \
                --mode debian \
                --distribution trixie \
                --backports true \
                --architectures amd64 \
                --binary-images iso \
                --archive-areas "main contrib non-free-firmware" \
                --mirror-bootstrap https://deb.debian.org/debian/ \
                --mirror-chroot https://deb.debian.org/debian/ \
                --mirror-binary https://deb.debian.org/debian/ \
                --mirror-chroot-security https://security.debian.org/debian-security/ \
                --mirror-binary-security https://security.debian.org/debian-security/ \
                --debian-installer none \
                --bootappend-live "boot=live components persistence username=user"

              lb build
              test -s binary/live/filesystem.squashfs
              unsquashfs -ll binary/live/filesystem.squashfs > /tmp/nyrox-files.txt

              for item in \
                usr/local/bin/nyrox \
                usr/local/bin/nyroxos-external-disk-check \
                usr/local/bin/nyroxos-iso-usb-check \
                usr/bin/nyroxos-update-engine \
                usr/bin/nyroxos-update-manager \
                etc/nyroxos/update.conf \
                usr/share/applications/nyroxos-update-manager.desktop \
                usr/share/nyroxos/keys/update-ed25519-public.pem \
                usr/share/nyroxos/keys/fingerprint.sha256 \
                usr/lib/systemd/system/nyroxos-update-apply.service \
                usr/lib/systemd/system/multi-user.target.wants/nyroxos-update-apply.service \
                opt/android-studio/bin/studio.sh \
                opt/android-studio/bin/studio.png \
                usr/local/bin/nyroxos-android-studio \
                usr/share/applications/android-studio.desktop \
                etc/skel/Desktop/Android-Studio.desktop; do
                grep -Fq "$item" /tmp/nyrox-files.txt || {
                  echo "Missing from ISO: $item"
                  exit 1
                }
              done

              echo "NyroxOS packages and update service verified."
            '

      - name: Verify ISO output
        run: |
          ls -lh live-image-amd64.iso
          test -s live-image-amd64.iso

      - name: Prepare release files
        id: release
        env:
          NYROX_UPDATE_SIGNING_KEY: ${{ secrets.NYROX_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          split -b 1900M -d -a 3 live-image-amd64.iso release-files/NyroxOS.iso.part-

          python3 - <<'PYISO'
          import hashlib, json
          from pathlib import Path

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          iso = Path("live-image-amd64.iso")
          parts = sorted(Path("release-files").glob("NyroxOS.iso.part-*"))
          manifest = {
              "type": "parts",
              "final_size": iso.stat().st_size,
              "final_sha256": digest(iso),
              "parts": [
                  {"index": i, "name": p.name, "size": p.stat().st_size,
                   "sha256": digest(p)}
                  for i, p in enumerate(parts)
              ]
          }
          Path("release-files/iso-manifest.json").write_text(
              json.dumps(manifest, separators=(",", ":")) + "\n"
          )
          PYISO

          key=$(mktemp)
          trap 'rm -f "$key" release-files/iso-manifest.sig.raw' EXIT
          printf '%s' "$NYROX_UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" \
            -in release-files/iso-manifest.json \
            -out release-files/iso-manifest.sig.raw
          base64 -w0 release-files/iso-manifest.sig.raw > release-files/iso-manifest.json.sig
          rm -f release-files/iso-manifest.sig.raw
          sha256sum release-files/* > release-files/SHA256SUMS
          echo "tag=nyroxos-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish NyroxOS Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.release.outputs.tag }}" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NyroxOS Build $GITHUB_RUN_NUMBER" \
            --notes "Automated NyroxOS build. Download all ISO parts and SHA256SUMS, then join the parts in filename order before using the ISO."
