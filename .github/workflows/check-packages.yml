name: Check Debian Trixie Packages

on:
  workflow_dispatch:
  push:
    paths:
      - "config/package-lists/nyroxos.list.chroot"
      - ".github/workflows/check-packages.yml"
  pull_request:
    paths:
      - "config/package-lists/nyroxos.list.chroot"
      - ".github/workflows/check-packages.yml"

jobs:
  check-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve all packages in Debian Trixie
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            debian:trixie-slim bash -euc '
              rm -f /etc/apt/sources.list.d/debian.sources
              printf "%s\n" \
                "deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware" \
                "deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware" \
                "deb http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware" \
                "deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware" \
                > /etc/apt/sources.list

              apt-get update

              grep -Ev "^[[:space:]]*(#|$)" \
                /work/config/package-lists/nyroxos.list.chroot \
                | xargs apt-get install --simulate --no-install-recommends
            '
